<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โครงการประเมินพื้นที่เสี่ยงธรณีพิบัติภัยแผ่นดินถล่ม จังหวัดน่าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--
  โครงสร้างหน้าเว็บ (ข้อความทั้งหมดแก้ที่ js/text.js ไม่ต้องแก้ในไฟล์นี้)
  1. ส่วนหัว: โลโก้ ชื่อเว็บ เมนู
  2. หน้าแผนที่: แถบควบคุม แผนที่ แผงสรุป เครื่องมือ คำอธิบายสัญลักษณ์ แถบสถานะ
  3. หน้าภาพรวม
  4. หน้าข้อมูลแผนที่
-->

<!-- ============ 1. ส่วนหัว ============ -->
<header class="top">
  <div class="brand">
    <div class="logos">
      <img src="assets/logo-nan.png" data-alt="site.logoNan" alt="">
      <img src="assets/logo-chula.png" data-alt="site.logoChula" alt="">
      <img src="assets/logo-geography.png" data-alt="site.logoGeo" alt="">
    </div>
    <div class="titles"><b data-text="site.title"></b><span data-text="site.subtitle"></span></div>
  </div>
  <nav class="nav">
    <a href="#map" data-view="map" data-text="nav.map"></a>
    <a href="#overview" data-view="overview" data-text="nav.overview"></a>
    <a href="#data-layers" data-view="data-layers" data-text="nav.layers"></a>
  </nav>
</header>

<!-- ============ 2. หน้าแผนที่ ============ -->
<section class="view" id="view-map">

  <!-- แถบควบคุม -->
  <div class="strip">
    <span class="lbl" data-text="strip.groups"></span>
    <span id="group-chips" class="row"></span>
    <span class="lbl" data-text="strip.model"></span>
    <span class="seg" id="model-seg" role="group">
      <button type="button" data-model="study" aria-pressed="true" data-text="strip.modelStudy"></button>
      <button type="button" data-model="dmr" aria-pressed="false" data-text="strip.modelDmr"></button>
    </span>
    <span class="sp"></span>
    <button class="iconbtn" id="btn-full" type="button" data-title="strip.fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div class="mapwrap" id="mapwrap">
    <div id="map"></div>

    <!-- แผงสรุปด้านซ้าย -->
    <aside class="float summary" id="summary">
      <header><h2 data-text="summary.title"></h2><button class="iconbtn" id="sum-toggle" type="button" data-title="summary.toggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button></header>
      <div class="body" id="sum-body">
        <div>
          <div class="muted small gap" data-text="summary.levelHint"></div>
          <div class="levels" id="levels"></div>
        </div>
        <div id="sum-table"></div>
        <div>
          <div class="muted small gap" data-text="summary.amphoeHint"></div>
          <div class="amphoe" id="amphoe"></div>
        </div>
      </div>
    </aside>

    <!-- เครื่องมือด้านขวา -->
    <div class="float rail" role="toolbar">
      <button class="iconbtn" data-tool="search" type="button" data-title="tools.search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="iconbtn" data-tool="layers" type="button" data-title="tools.layers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg></button>
      <button class="iconbtn" data-tool="measure" type="button" data-title="tools.measure"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
      <hr>
      <button class="iconbtn" id="zin" type="button" data-title="tools.zoomIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="zout" type="button" data-title="tools.zoomOut"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
      <button class="iconbtn" id="zfit" type="button" data-title="tools.fit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <hr>
      <!-- ทิศเหนือ: เข็มหมุนตามการหมุนแผนที่ กดเพื่อกลับทิศเหนือ -->
      <button class="iconbtn north" id="btn-north" type="button" data-title="tools.north">
        <svg id="compass-needle" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l4.2 10H7.8z" fill="#c62828"/><path d="M12 22l4.2-10H7.8z" fill="currentColor" opacity=".35"/></svg>
        <span>N</span>
      </button>
      <!-- มุมมอง 2 มิติ / 3 มิติ -->
      <button class="iconbtn view3d" id="btn-3d" type="button" aria-pressed="false" data-title="tools.view3d"><span id="btn-3d-label">2D</span></button>
    </div>

    <!-- แผงด้านขวา: ชั้นข้อมูล / ค้นหา / เครื่องมือวัด -->
    <aside class="float side" id="side" hidden>
      <header><h2 id="side-title"></h2><button class="iconbtn" id="side-close" type="button" data-title="tools.closePanel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="body" id="side-body"></div>
    </aside>

    <!-- คำอธิบายสัญลักษณ์ -->
    <button class="float legendbtn" id="legend-btn" type="button" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h4M4 12h4M4 18h4M12 6h8M12 12h8M12 18h8"/></svg><span data-text="legend.button"></span></button>
    <aside class="float legend" id="legend"><div class="body" id="legend-body"></div></aside>
  </div>

  <!-- แถบสถานะ -->
  <footer class="statusbar">
    <span id="st-loaded" class="num"></span>
    <span class="muted" id="st-note"></span>
    <span class="sp"></span>
    <label class="muted" for="crs" data-text="status.crs"></label>
    <select id="crs"><option value="ll" data-text="status.crsLatLong"></option><option value="utm" data-text="status.crsUtm"></option></select>
    <span id="st-coord" class="mono num" data-text="status.hover"></span>
    <span class="mono num"><span data-text="status.zoom"></span>: <span id="st-zoom"></span></span>
  </footer>
</section>

<!-- ============ 3. หน้าภาพรวม ============ -->
<section class="view" id="view-overview" hidden>
  <div class="doc"><div class="inner" id="overview"></div></div>
</section>

<!-- ============ 4. หน้าข้อมูลแผนที่ ============ -->
<section class="view" id="view-data-layers" hidden>
  <div class="doc"><div class="inner" id="catalog"></div></div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ลำดับการโหลด: ไลบรารีแผนที่ -> ข้อความและค่าตั้ง -> ข้อมูล -> โค้ดของเว็บ -->
<script src="vendor/maplibre-gl.js"></script>
<script src="js/text.js"></script>
<script src="js/settings.js"></script>
<script src="js/layers-config.js"></script>
<script src="data/core.js"></script>
<script src="data/rasters-index.js"></script>
<script src="js/core.js"></script>
<script src="js/geo.js"></script>
<script src="js/map.js"></script>
<script src="js/measure.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/main.js"></script>
</body>
</html>
